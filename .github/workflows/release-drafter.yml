name: Release Drafter

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Draft only. Publishing in the GitHub UI creates the v* tag, which is
      # what runs publish-nuget. Do not set publish or prerelease to true.
      - uses: release-drafter/release-drafter@v7
        with:
          publish: false
          prerelease: false
