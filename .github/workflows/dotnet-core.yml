name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
jobs:
  ci:    
    runs-on: windows-latest

    env:
      GITHUB_NUGET_SOURCE_URL: https://nuget.pkg.github.com/LtiLibrary/index.json
    steps:
    - uses: actions/checkout@v7
    - name: Fetch tags
      run: |
        git fetch origin +refs/tags/*:refs/tags/*
        git fetch --prune --unshallow
    - name: Build Reason
      run: "echo ref: ${{github.ref}} event: ${{github.event_name}}"
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0'
    - name: Build
      run: dotnet build --configuration Release
    - name: Test
      run: |
        dotnet test --configuration Release --results-directory artifacts --no-build --logger 'trx;LogFileName=test-results.trx'
    - uses: actions/upload-artifact@v7  # upload test results
      if: success() || failure()        # run this step even if previous step failed
      with:
        name: test-results
        path: 'artifacts/*.trx'
    - name: Package
      if: github.event_name != 'pull_request'
      run: dotnet pack --configuration Release --no-build
    - name: Publish nuget
      if: github.event_name != 'pull_request'
      run: dotnet nuget push src/*/bin/Release/*.nupkg --skip-duplicate --source ${{ env.GITHUB_NUGET_SOURCE_URL }} --api-key ${{ secrets.GITHUB_TOKEN }}
    - name: Upload Packages
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: |
          src/*/bin/Release/*.nupkg
          src/*/bin/Release/*.snupkg
        if-no-files-found: error
    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: artifacts
        path: artifacts

  # Publishes release packages to nuget.org with NuGet trusted publishing: the job exchanges a
  # GitHub OIDC token for a short-lived API key, so no long-lived NuGet API key is stored.
  # Only v* tags reach this job, and it runs in the "release" environment, which the nuget.org
  # trusted publishing policy is restricted to.
  publish-nuget:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write  # required to request the OIDC token NuGet/login exchanges for an API key
    steps:
    - name: Download Packages
      uses: actions/download-artifact@v7
      with:
        name: packages
        path: packages
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0'
    - name: NuGet login (OIDC to temporary API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}  # nuget.org profile name of the policy owner, not an email address
    - name: Publish Release Packages
      # Symbol packages (.snupkg) next to each .nupkg are pushed along with it.
      run: dotnet nuget push "packages/**/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
